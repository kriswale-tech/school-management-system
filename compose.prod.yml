name: sms-prod

services:
  backend:
    env_file:
      - .env.prod
    # Host Caddy proxies API requests to this loopback-only port.
    ports:
      - "127.0.0.1:18200:8000"

  celery-worker:
    env_file:
      - .env.prod

  celery-beat:
    env_file:
      - .env.prod

  migrate:
    env_file:
      - .env.prod

  db:
    env_file:
      - .env.prod

  redis:
    env_file:
      - .env.prod
