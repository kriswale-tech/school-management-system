x-backend: &backend
  image: ghcr.io/kriswale-tech/school-management-system-backend:${IMAGE_TAG:?Set IMAGE_TAG to the commit SHA tag}
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks:
    - app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  backend:
    <<: *backend
    command: ["gunicorn", "core.wsgi:application", "--bind=0.0.0.0:8000", "--workers=2", "--threads=2", "--timeout=120", "--graceful-timeout=30", "--access-logfile=-", "--error-logfile=-"]
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  celery-worker:
    <<: *backend
    command: ["celery", "-A", "core", "worker", "-l", "info", "--concurrency=2"]

  celery-beat:
    <<: *backend
    command: ["celery", "-A", "core", "beat", "-l", "info", "--schedule=/tmp/celerybeat-schedule"]

  migrate:
    <<: *backend
    profiles: [release]
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app:

volumes:
  postgres_data:
  redis_data:
