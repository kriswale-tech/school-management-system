  frontend:
    container_name: sms_frontend
    build:
      context: ./sms-frontend
      dockerfile: Dockerfile
    volumes:
      - ./sms-frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "3003:5173"
    stdin_open: true
    tty: true
    

  db:
    container_name: sms_db
    image: postgres:16
    env_file:
      - .env
    ports:
      - "5434:5432"
    volumes:
      - sms_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

