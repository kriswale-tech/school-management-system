services:
  backend:
    container_name: sms_backend
    build:
      context: ./sms-backend
      dockerfile: Dockerfile
    volumes:
      - ./sms-backend:/app
    ports:
      - "9000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-worker:
    container_name: sms_celery_worker
    build:
      context: ./sms-backend
      dockerfile: Dockerfile
    command: celery -A core worker -l info
    volumes:
      - ./sms-backend:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    container_name: sms_celery_beat
    build:
      context: ./sms-backend
      dockerfile: Dockerfile
    command: celery -A core beat -l info
    volumes:
      - ./sms-backend:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    container_name: sms_frontend
    build:
      context: ./sms-frontend
      dockerfile: Dockerfile
    volumes:
      - ./sms-frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "3003:5173"
    stdin_open: true
    tty: true

  platform-admin:
    container_name: sms_platform_admin
    build:
      context: ./platform-admin
      dockerfile: Dockerfile
    volumes:
      - ./platform-admin:/app
      - platform_admin_node_modules:/app/node_modules
    ports:
      - "3004:5174"
    stdin_open: true
    tty: true

  db:
    container_name: sms_db
    image: postgres:16
    env_file:
      - .env
    ports:
      - "5434:5432"
    volumes:
      - sms_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Host 6379 is already used by another local Redis container.
  # Map SMS Redis to 6380 on the host; containers still talk on redis:6379.
  redis:
    container_name: sms_redis
    image: redis:7-alpine
    ports:
      - "6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sms_db_data:
  node_modules:
  platform_admin_node_modules:
