services:
  backend:
    container_name: sms_backend
    build:
      context: ./sms-backend
      dockerfile: Dockerfile
    volumes:
      - ./sms-backend:/app
    ports:
      - "9000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      # redis:
      #   condition: service_healthy
    restart: unless-stopped

  # celery-worker:
